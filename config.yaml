# 服务端配置（可改密码；上线后务必改 secret）
host: 0.0.0.0
port: 8787
secret: change-me-to-a-long-random-string
token_ttl_hours: 24

# 写死账号（后续可改数据库）
users:
  - username: admin
    password: admin123
  - username: test
    password: test123
  - username: user1
    password: user123
  - username: bamao
    password: bamao123

# 默认任务参数（客户端可覆盖部分字段）
tasks:
  common:
    use_formation: true
    adjust_level: false
    use_stamina: false
    stamina_can_limit: 800
  hunt_ice_beast:
    interval: 120
    beast_level: 8
    default_beast_level: 1
    adjust_level: false
    formation_name: "6"
    rally_duration_minutes: 5
    use_stamina: false
    stamina_can_limit: 800
    check_march_heroes: true
    use_formation: true
    skip_hour: -1
    step_delay: 1.5
  hunt_monster:
    interval: 60
    monster_level: 30
    adjust_level: false
    formation_name: "6"
    use_stamina: false
    stamina_can_limit: 800
    use_formation: true
    skip_hour: -1
    step_delay: 1.5
  auto_lighthouse:
    interval: 60
    event_period: false
    formation_slot: 8
    check_march_heroes: true
    use_stamina: false
    stamina_can_limit: 800
    monster_cooldown: 60
    step_delay: 1.5
  auto_mining:
    interval: 3600
    use_mining_hero: true
    level_min: 8
    level_max: 8
    adjust_level: false
    step_delay: 1.5
    hero_match_threshold: 0.68
